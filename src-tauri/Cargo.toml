[package]
name = "codaru-planning"
version = "0.1.0"
description = "Planificación y conocimiento local"
authors = ["fsaldivar-dev"]
edition = "2021"

[lib]
name = "codaru_planning_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-kairo = { git = "https://github.com/fsaldivar-dev/Kairo", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
